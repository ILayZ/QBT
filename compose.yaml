name: qbt

x-app: &app
  image: ${COMPOSE_PROJECT_NAME}-platform:local
  environment: &app-env
    DATABASE_URL: postgresql://qbt:${QBT_DB_PASSWORD:-qbt-local}@postgres/qbt
    PGCONNECT_TIMEOUT: "3"
  restart: unless-stopped
  init: true
  read_only: true
  pids_limit: 128
  networks: [backend]

services:
  api:
    <<: *app
    build:
      context: .
    pull_policy: build
    command:
      - python
      - -m
      - uvicorn
      - api:app
      - --app-dir
      - apps/platform
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --workers
      - "1"
      - --limit-concurrency
      - "32"
    networks: [default, backend]
    ports:
      - "127.0.0.1:${QBT_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10
    cpus: 1
    mem_limit: 512m

  worker:
    <<: *app
    pull_policy: never
    environment:
      <<: *app-env
      POLARS_MAX_THREADS: "2"
      RAYON_NUM_THREADS: "2"
    command: ["python", "apps/platform/worker.py"]
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=128m,mode=1777
    cpus: 2
    mem_limit: 1g

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: qbt
      POSTGRES_PASSWORD: ${QBT_DB_PASSWORD:-qbt-local}
      POSTGRES_DB: qbt
    command: ["postgres", "-c", "max_connections=64"]
    networks: [backend]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    cpus: 1
    mem_limit: 512m
    pids_limit: 128

volumes:
  postgres-data:

networks:
  backend:
    internal: true
