[package]
name = "qbacktest"
version = "0.1.0"
edition = "2024"

[dependencies]
# Data handling
polars = { version = "0.42", features = ["csv", "parquet", "serde", "json", "ipc", "dtype-categorical", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-decimal", "dtype-full", "lazy", "temporal", "timezones", "strings", "concat_str", "diagonal_concat"] }
argh = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
# Parallel processing
rayon = "1.10"
# Plotting for HTML reports
plotters = { version = "0.3", features = ["svg_backend"] }
# Math/statistics
statrs = "0.16"
# Configuration
config = "0.14"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Progress bars
indicatif = "0.17"
# Random for simulations
rand = "0.8"
rand_distr = "0.4"
# Parquet support (via polars already includes parquet)
arrow = { version = "51", features = ["csv"] }
