<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy testing · QBT</title>
<link rel="stylesheet" href="/ui/styles.css">
<header><strong>QBT</strong><span>Strategy testing</span><a href="/docs">API docs ↗</a></header>
<main>
<h1>Backtest workspace</h1>
<div class="layout">
<form id="run-form">
<h2>New run</h2>
<label>Market data <input type="file" id="file" accept=".csv,text/csv" required aria-describedby="file-note"></label>
<small id="file-note">Hourly OHLCV · CSV up to 8 MiB</small>
<label for="strategy">Strategy</label>
<select id="strategy" name="strategy" required><option value="">Loading…</option></select>
<div class="fields">
<label>Initial capital <input name="capital" type="number" step="any" min="0" required></label>
<label>Order amount <input name="order_amount" type="number" step="any" min="0" placeholder="Strategy default"></label>
<label>Daily buy limit <input name="daily_limit" type="number" step="any" min="0" placeholder="Unlimited"></label>
<label>Minimum order <input name="min_notional" type="number" step="any" min="0" placeholder="No minimum"></label>
</div>
<details><summary>Execution and strategy settings</summary>
<div class="fields">
<label>Fee (fraction) <input name="fee" type="number" step="any" min="0" required></label>
<label>Slippage (fraction) <input name="slippage" type="number" step="any" min="0" required></label>
<label>Annual risk-free rate <input name="risk_free" type="number" step="any" required></label>
<label>DCA interval (hours) <input name="dca_interval" type="number" min="1" required></label>
<label>DCA amount <input name="dca_amount" type="number" step="any" min="0" required></label>
<label>DipDCA lookback (hours) <input name="dip_lookback" type="number" min="2" required></label>
<label>DipDCA drop (%) <input name="dip_percent" type="number" step="any" min="0" max="100" required></label>
</div><label class="check"><input name="limit_includes_fees" type="checkbox"> Include fees in daily limit</label></details>
<button id="start" disabled>Start backtest</button>
<p role="alert" id="error"></p>
</form>
<section aria-labelledby="result-title">
<h2 id="result-title">Run results</h2>
<p id="state" role="status">Waiting for a run</p>
<dl id="metadata"></dl>
<p id="diagnostic"></p>
<button type="button" id="cancel-run" hidden>Cancel run</button>
<p id="cancel-error" role="alert"></p>
<button id="retry" hidden>Refresh status</button>
<nav id="artifacts" aria-label="Result downloads"></nav>
</section>
</div>
<section class="comparison" id="comparison" aria-labelledby="comparison-title" hidden>
<h2 id="comparison-title">Strategy comparison</h2>
<p id="comparison-message" aria-live="polite"></p>
<div id="comparison-content" hidden>
<h3 id="portfolio-title">Portfolio results</h3>
<div class="comparison-scroll" role="region" aria-labelledby="portfolio-title" tabindex="0">
<table id="portfolio-table" aria-labelledby="portfolio-title"><thead><tr></tr></thead><tbody></tbody></table>
</div>
<h3>Equity curves</h3>
<svg id="equity-chart" role="img" aria-labelledby="equity-chart-title" aria-describedby="equity-chart-description"></svg>
<ul id="equity-legend" aria-label="Portfolio legend"></ul>
<h3 id="order-title">Order ledger</h3>
<label for="order-strategy">Ledger portfolio</label>
<select id="order-strategy"></select>
<p id="order-range" aria-live="polite"></p>
<div class="comparison-scroll" role="region" aria-labelledby="order-title" tabindex="0">
<table id="order-table" aria-labelledby="order-title"><thead><tr></tr></thead><tbody></tbody></table>
</div>
<div class="order-pagination">
<button type="button" id="order-previous">Previous orders</button>
<button type="button" id="order-next">Next orders</button>
</div>
</div>
</section>
<section class="history" aria-labelledby="history-title">
<div class="history-header"><h2 id="history-title">Run history</h2><button type="button" id="history-refresh">Refresh history</button></div>
<p id="history-message">Loading runs…</p>
<ol id="past-runs"></ol>
<button type="button" id="older" hidden>Load older runs</button>
</section></main>
<script type="module" src="/ui/app.js"></script>
</html>
