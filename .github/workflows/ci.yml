name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (fontconfig for plotters SVG backend)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --workspace --release --locked

      - name: Show binary
        run: |
          ls -lh target/release/qbt
          file target/release/qbt

  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Run E2E script
        run: |
          chmod +x scripts/e2e_verify.sh
          ./scripts/e2e_verify.sh

      - name: Save sample comparison report and order journal
        uses: actions/upload-artifact@v4
        with:
          name: btc-comparison-min-1
          path: |
            .e2e/min.html
            .e2e/min.csv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
