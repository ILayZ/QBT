name: Compose deployment

on:
  pull_request:
    branches: [master, main]
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'Cargo.*'
      - 'apps/cli/**'
      - 'apps/platform/**'
      - 'apps/web/**'
      - 'crates/**'
      - 'data/sample_btc_1h.csv'
      - '.github/workflows/compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Build and verify the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: qbt-compose-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 90

      - name: Verify run artifacts and restore a backup
        run: python3 apps/platform/test_compose.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Remove the CI test project and its test volume
        if: always()
        run: docker compose down --volumes
